<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offcomfrt — COO / CXO Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14161c;
  --ink-soft:#1f222b;
  --ink-line:#33374a;
  --paper:#f1efe8;
  --paper-raised:#ffffff;
  --paper-sunken:#e8e4d8;
  --line:#dfd9c8;
  --line-soft:#eae5d7;
  --text:#1c1d22;
  --text-muted:#6d6a63;
  --text-faint:#a29e93;
  --amber:#c98a2c;
  --amber-deep:#9c6b1f;
  --amber-tint:#f3e2bd;
  --brick:#ac4738;
  --brick-tint:#f2ddd6;
  --sage:#4f7a5b;
  --sage-tint:#dde8de;
  --slate:#3f6180;
  --slate-tint:#dde6ec;
  --plum:#7a5480;
  --plum-tint:#ece0ee;
  --radius-s:4px;
  --radius-m:7px;
  --radius-l:12px;
  --shadow-card: 0 1px 0 rgba(20,22,28,0.04);
  --shadow-modal: 0 20px 60px rgba(20,22,28,0.35);
  --font-display:'Space Grotesk', system-ui, sans-serif;
  --font-body:'Inter', system-ui, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, monospace;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.5;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;font-weight:600;letter-spacing:-0.01em;}
p{margin:0;}
a{color:inherit;}
button{font-family:var(--font-body);cursor:pointer;}
::selection{background:var(--amber-tint);}
:focus-visible{outline:2px solid var(--amber-deep);outline-offset:2px;}
button:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--amber-deep);outline-offset:1px;}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:246px 1fr;min-height:100vh;}
@media (max-width:880px){.shell{grid-template-columns:1fr;}}

.sidebar{
  background:var(--ink);
  color:#e9e7e0;
  padding:20px 14px 16px;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  overflow-y:auto;
}
@media (max-width:880px){.sidebar{position:relative;height:auto;}}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;border-bottom:1px solid var(--ink-line);margin-bottom:14px;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(155deg,var(--amber),var(--amber-deep));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:var(--ink);font-size:15px;flex:none;}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-text .b1{font-family:var(--font-display);font-weight:700;font-size:14.5px;color:#fff;letter-spacing:0.01em;}
.brand-text .b2{font-size:10px;color:#9a9fb0;margin-top:2px;font-weight:500;}

.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:#7d8299;padding:14px 10px 6px;}
.nav-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-s);color:#c7c9d6;font-size:13px;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:var(--font-body);}
.nav-item:hover{background:var(--ink-soft);color:#fff;}
.nav-item.active{background:var(--ink-soft);color:#fff;box-shadow:inset 3px 0 0 var(--amber);}
.nav-icon{width:16px;text-align:center;flex:none;opacity:0.9;}
.nav-badge{margin-left:auto;background:var(--brick);color:#fff;font-size:10px;font-weight:600;border-radius:10px;padding:1px 6px;min-width:16px;text-align:center;}
.nav-badge.amber{background:var(--amber);color:#2a1c00;}

.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--ink-line);}
.role-select{width:100%;background:var(--ink-soft);color:#e9e7e0;border:1px solid var(--ink-line);border-radius:var(--radius-s);padding:7px 8px;font-size:12px;font-family:var(--font-body);}
.demo-tag{font-size:10px;color:#7d8299;margin-top:8px;line-height:1.45;}

.main{min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;
  padding:12px 22px;
}
.topbar-date{font-size:12px;color:var(--text-muted);white-space:nowrap;}
.search-wrap{flex:1;max-width:440px;position:relative;}
.search-input{width:100%;padding:8px 12px 8px 30px;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--paper-raised);font-size:13px;font-family:var(--font-body);color:var(--text);}
.search-input:focus{border-color:var(--amber-deep);}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text-faint);}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:var(--shadow-modal);max-height:420px;overflow-y:auto;z-index:40;}
.search-hit{padding:9px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer;display:flex;flex-direction:column;gap:2px;}
.search-hit:last-child{border-bottom:none;}
.search-hit:hover{background:var(--paper-sunken);}
.search-hit-title{font-size:13px;font-weight:600;}
.search-hit-meta{font-size:11px;color:var(--text-muted);}
.topbar-spacer{flex:1;}
.icon-btn{position:relative;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-m);width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:15px;}
.icon-btn:hover{border-color:var(--amber-deep);}
.dot-badge{position:absolute;top:-4px;right:-4px;background:var(--brick);color:#fff;font-size:9.5px;font-weight:700;border-radius:10px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--paper);}
.btn-primary{background:var(--ink);color:#fff;border:none;border-radius:var(--radius-m);padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;}
.btn-primary:hover{background:var(--ink-soft);}

.view{padding:22px 26px 60px;max-width:1280px;width:100%;margin:0 auto;}

/* ---------- generic building blocks ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.page-eyebrow{font-size:11.5px;color:var(--amber-deep);font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.page-title{font-size:22px;}
.page-sub{font-size:13px;color:var(--text-muted);margin-top:4px;max-width:70ch;}
.tab-row{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap;}
.tab-btn{background:none;border:none;padding:9px 13px;font-size:13px;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--text);border-bottom-color:var(--amber);font-weight:600;}

.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:920px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;}
.card-title{font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.card-title .count{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);font-weight:500;}
.card.accent-left{border-left:3px solid var(--line);}

.stat-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px 16px;}
.stat-num{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1;}
.stat-label{font-size:11.5px;color:var(--text-muted);margin-top:6px;}

.list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);}
.list-row:last-child{border-bottom:none;}
.list-row-main{flex:1;min-width:0;}
.list-row-title{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.list-row-meta{font-size:11.5px;color:var(--text-muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;}
.empty-row{padding:16px 4px;color:var(--text-faint);font-size:12.5px;font-style:italic;}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.8px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;line-height:1.7;}
.chip-p0{background:var(--brick-tint);color:var(--brick);}
.chip-p1{background:var(--amber-tint);color:var(--amber-deep);}
.chip-p2{background:var(--slate-tint);color:var(--slate);}
.chip-p3{background:var(--line-soft);color:var(--text-muted);}
.chip-status{background:var(--line-soft);color:var(--text);}
.chip-good{background:var(--sage-tint);color:var(--sage);}
.chip-warn{background:var(--amber-tint);color:var(--amber-deep);}
.chip-bad{background:var(--brick-tint);color:var(--brick);}
.chip-info{background:var(--slate-tint);color:var(--slate);}
.chip-plum{background:var(--plum-tint);color:var(--plum);}
.chip-outline{background:none;border:1px solid var(--line);color:var(--text-muted);}

.avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;flex:none;font-family:var(--font-display);}
.avatar.lg{width:38px;height:38px;font-size:13px;}

.progress-track{background:var(--line-soft);border-radius:20px;height:6px;overflow:hidden;}
.progress-fill{height:100%;border-radius:20px;background:var(--amber);}

table.data-table{width:100%;border-collapse:collapse;font-size:12.8px;}
.data-table th{text-align:left;font-size:10.8px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
.data-table td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
.data-table tr:hover td{background:var(--paper-sunken);}
.data-table tr.clickable{cursor:pointer;}
.mono{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--paper-raised);}
.table-wrap table{border:none;}
.table-wrap .data-table th:first-child,.table-wrap .data-table td:first-child{padding-left:14px;}

.section-block{margin-bottom:26px;}
.section-block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap;}
.section-block-title{font-size:15px;}
.section-block-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}

.btn{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-s);padding:6px 11px;font-size:12.3px;font-weight:600;color:var(--text);}
.btn:hover{border-color:var(--amber-deep);}
.btn.small{padding:4px 9px;font-size:11.5px;}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn.dark:hover{background:var(--ink-soft);}
.btn.danger{color:var(--brick);border-color:var(--brick-tint);}
.btn.danger:hover{border-color:var(--brick);}
.btn.ghost{background:none;border:1px solid transparent;}
.btn.ghost:hover{border-color:var(--line);}
.btn:disabled{opacity:0.45;cursor:not-allowed;}

.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.filter-bar select, .filter-bar input[type=text]{border:1px solid var(--line);border-radius:var(--radius-s);padding:6px 9px;font-size:12.3px;font-family:var(--font-body);background:var(--paper-raised);color:var(--text);}
.field-label{font-size:11.5px;font-weight:600;color:var(--text-muted);margin-bottom:4px;display:block;}
.field{margin-bottom:12px;}
.field input[type=text],.field input[type=date],.field input[type=number],.field input[type=time],select.field-input,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:var(--radius-s);padding:8px 10px;font-size:13px;font-family:var(--font-body);background:var(--paper-raised);color:var(--text);
}
.field textarea{resize:vertical;min-height:60px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(20,20,24,0.5);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto;}
.modal{background:var(--paper-raised);border-radius:var(--radius-l);width:100%;max-width:560px;box-shadow:var(--shadow-modal);}
.modal.wide{max-width:760px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);}
.modal-title{font-size:16px;}
.modal-close{background:none;border:none;font-size:18px;color:var(--text-muted);line-height:1;padding:4px;}
.modal-body{padding:18px 20px;max-height:70vh;overflow-y:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);}

.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--radius-m);font-size:12.8px;box-shadow:var(--shadow-modal);max-width:320px;}

.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
@media (max-width:920px){.kpi-strip{grid-template-columns:repeat(2,1fr);}}

.workload-bar-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
.workload-track{flex:1;background:var(--line-soft);border-radius:20px;height:8px;overflow:hidden;position:relative;}
.workload-fill{height:100%;border-radius:20px;}

.milestone-track{display:flex;align-items:center;gap:0;margin:14px 0;overflow-x:auto;}
.milestone-node{display:flex;flex-direction:column;align-items:center;min-width:110px;text-align:center;position:relative;}
.milestone-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--paper-raised);margin-bottom:6px;z-index:1;}
.milestone-dot.done{background:var(--sage);border-color:var(--sage);}
.milestone-dot.active{background:var(--amber);border-color:var(--amber);}
.milestone-connector{flex:1;height:2px;background:var(--line);margin-top:-24px;min-width:24px;}
.milestone-connector.done{background:var(--sage);}
.milestone-name{font-size:11.5px;font-weight:600;}
.milestone-meta{font-size:10.5px;color:var(--text-muted);margin-top:2px;}

.hero-card{background:linear-gradient(155deg,var(--ink) 0%, #262a37 100%);color:#fff;border-radius:var(--radius-l);padding:26px 26px;margin-bottom:20px;}
.hero-greeting{font-family:var(--font-display);font-size:25px;color:#fff;}
.hero-date{color:#a9adbd;font-size:13px;margin-top:3px;}
.hero-one-thing{margin-top:18px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius-m);padding:14px 16px;}
.hero-one-thing-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.07em;color:var(--amber-tint);font-weight:700;}
.hero-one-thing-text{font-size:15px;margin-top:5px;font-weight:500;}
.priority-list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;}
.priority-item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.06);border-radius:var(--radius-s);padding:9px 12px;}
.priority-num{font-family:var(--font-display);font-weight:700;color:var(--amber);font-size:14px;width:16px;}

.assistant-shell{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:480px;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;}
.assistant-msgs{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
.msg{max-width:80%;padding:10px 14px;border-radius:var(--radius-m);font-size:13.3px;line-height:1.55;white-space:pre-wrap;}
.msg.user{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:2px;}
.msg.ai{align-self:flex-start;background:var(--paper-sunken);border-bottom-left-radius:2px;}
.msg.ai.loading{color:var(--text-muted);font-style:italic;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 12px;}
.suggest-chip{background:var(--paper-sunken);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12px;}
.suggest-chip:hover{border-color:var(--amber-deep);}
.assistant-input-row{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line);}
.assistant-input-row input{flex:1;border:1px solid var(--line);border-radius:var(--radius-m);padding:10px 12px;font-size:13.5px;font-family:var(--font-body);}

.escalation-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:0.03em;}

.audit-item{font-size:12px;padding:7px 0;border-bottom:1px solid var(--line-soft);color:var(--text-muted);}
.audit-item b{color:var(--text);font-weight:600;}

.person-card{display:flex;gap:10px;align-items:flex-start;}

.org-node{border:1px solid var(--line);background:var(--paper-raised);border-radius:var(--radius-m);padding:10px 14px;text-align:center;min-width:150px;}
.org-level{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:8px;position:relative;}
.org-connector{width:1px;height:18px;background:var(--line);margin:0 auto;}

.scrollx{overflow-x:auto;}

@media print{
  .sidebar,.topbar,.no-print{display:none !important;}
  .shell{display:block;}
  .view{max-width:none;padding:0;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-wrap"></div>
<script>
/* =========================================================================
   OFFCOMFRT — COO / CXO CONTROL ROOM
   Single-file dashboard tailored specifically for Chief Operating Officer (COO)
   and Chief Experience Officer (CXO) dual leadership.
   Vanilla JS SPA. Supports local storage & fallback.
   ========================================================================= */

const STORAGE_KEY = 'offcomfrt-coo-cxo-dashboard-v1';

/* ---------------------------- constants ---------------------------- */
const DEPARTMENTS = [
  'Supply Chain & Sourcing',
  'Fulfillment & Warehousing',
  'Logistics & Carriers',
  'Quality Assurance (QA)',
  'Customer Support & Ops',
  'Post-Purchase CX',
  'Reverse Logistics & Returns',
  'Process Excellence'
];

const PRIORITIES = [
  {id:'P0', label:'P0 — Critical Escalation', className:'chip-p0'},
  {id:'P1', label:'P1 — High Priority', className:'chip-p1'},
  {id:'P2', label:'P2 — Normal Operations', className:'chip-p2'},
  {id:'P3', label:'P3 — Low / Continuous', className:'chip-p3'},
];

const STATUSES = ['Inbox','Planned','Assigned','Accepted','In Progress','Waiting','Blocked','In Review','Completed','Cancelled'];
const ACTIVE_STATUSES = STATUSES.filter(s => s!=='Completed' && s!=='Cancelled');
const PROJECT_STATUSES = ['Not Started','On Track','At Risk','Blocked','Completed','Cancelled'];
const AVATAR_COLORS = ['#c98a2c','#3f6180','#4f7a5b','#ac4738','#7a5480','#9c6b1f','#3f6180','#4f7a5b','#7a5480','#ac4738'];

const PERSON_ROLE_OPTIONS = ['COO / CXO','Operations Lead','CX & Support Lead','Team Member'];

/* ---------------------------- date helpers ---------------------------- */
function todayISO(){ return dateOnly(new Date()); }
function dateOnly(d){ const x = new Date(d); x.setHours(0,0,0,0); return x.toISOString().slice(0,10); }
function addDays(iso, n){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return dateOnly(d); }
function daysBetween(fromISO, toISO){
  const a = new Date(fromISO+'T00:00:00'), b = new Date(toISO+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function fmtDate(iso, opts){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US', opts || {month:'short', day:'numeric'});
}
function fmtDateLong(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
}
function fmtDateTime(iso){
  return fmtDate(iso) + ', ' + new Date().getFullYear();
}
function daysFromToday(iso){ return daysBetween(todayISO(), iso); }
function relativeDay(iso){
  const n = daysFromToday(iso);
  if(n===0) return 'Today';
  if(n===1) return 'Tomorrow';
  if(n===-1) return 'Yesterday';
  if(n>1 && n<=6) return 'In ' + n + ' days';
  if(n<-1 && n>=-6) return n*-1 + ' days ago';
  return fmtDate(iso);
}
function isOverdue(t){
  return t.dueDate && daysFromToday(t.dueDate) < 0 && t.status !== 'Completed' && t.status !== 'Cancelled';
}
function isDueToday(t){ return t.dueDate && daysFromToday(t.dueDate)===0 && t.status!=='Completed' && t.status!=='Cancelled'; }

let _idCounters = {};
function genId(prefix){
  _idCounters[prefix] = (_idCounters[prefix]||0)+1;
  return prefix + '-' + String(_idCounters[prefix]).padStart(3,'0') + '-' + Math.random().toString(36).slice(2,5);
}

function initials(name){
  return name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
}
function colorForId(id){
  let h=0; for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}

function escapeHtml(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nl2br(s){ return escapeHtml(s).replace(/\n/g,'<br>'); }

/* Safe Storage Engine */
const StorageEngine = {
  async get(key){
    if(window.storage && typeof window.storage.get === 'function'){
      try{ return await window.storage.get(key, false); }catch(e){}
    }
    try{
      const v = localStorage.getItem(key);
      return v ? {value: v} : null;
    }catch(e){ return null; }
  },
  async set(key, val){
    if(window.storage && typeof window.storage.set === 'function'){
      try{ return await window.storage.set(key, val, false); }catch(e){}
    }
    try{ localStorage.setItem(key, val); }catch(e){}
  }
};

async function loadState(){
  try{
    const res = await StorageEngine.get(STORAGE_KEY);
    if(res && res.value){
      STATE.data = JSON.parse(res.value);
      if(!STATE.data.settings) STATE.data.settings = buildDemoData().settings;
      if(!STATE.data.endOfDayLogs) STATE.data.endOfDayLogs = [];
      if(!STATE.data.notifDismissed) STATE.data.notifDismissed = [];
    } else {
      STATE.data = buildDemoData();
      await saveState();
    }
  }catch(e){
    STATE.data = buildDemoData();
    try{ await saveState(); }catch(e2){}
  }
}

let _saveTimer = null;
function saveState(){
  return new Promise((resolve)=>{
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(async ()=>{
      try{
        await StorageEngine.set(STORAGE_KEY, JSON.stringify(STATE.data));

    }, 200);
  });
}

function activeTasksFor(personId){
  return STATE.data.tasks.filter(t=>t.assignee===personId && t.status!=='Completed' && t.status!=='Cancelled');
}

function utilizationFor(personId){
  const person = personById(personId);
  if(!person) return {pct:0, level:'Healthy', emoji:'🟢', assignedHours:0, availableHours:0};
  const active = activeTasksFor(personId);
  const assignedHours = active.reduce((s,t)=> s + (Number(t.estimatedTime)||1) , 0);
  const availableHours = person.workingHours || 40;
  const pct = availableHours>0 ? Math.round((assignedHours/availableHours)*100) : 0;
  let level, emoji;
  if(pct < 40){ level='Underloaded'; emoji='🟢'; }
  else if(pct < 75){ level='Healthy'; emoji='🟢'; }
  else if(pct < 100){ level='Busy'; emoji='🟡'; }
  else if(pct < 130){ level='High Load'; emoji='🟠'; }
  else { level='Overloaded'; emoji='🔴'; }
  return {pct, level, emoji, assignedHours, availableHours};
}

function glanceWorkload(personId){
  const u = utilizationFor(personId);
  const overdue = STATE.data.tasks.filter(t=>t.assignee===personId && isOverdue(t)).length;
  if(u.pct>=130 || overdue>=3) return {level:'Overloaded', emoji:'🔴'};
  if(u.pct>=100 || overdue===2) return {level:'High Load', emoji:'🟠'};
  if(u.pct>=70 || overdue===1) return {level:'Busy', emoji:'🟡'};
  return {level:'Healthy', emoji:'🟢'};
}

function isStale(t){
  if(t.status==='Completed' || t.status==='Cancelled') return false;
  const s = STATE.data.settings;
  const noUpdate = daysFromToday(t.lastUpdated) * -1;
  const openDays = daysFromToday(t.createdDate) * -1;
  const dueSoon = t.dueDate ? daysFromToday(t.dueDate) : null;
  if(noUpdate >= s.staleNoUpdateDays && openDays >= s.staleOpenDays) return true;
  if(noUpdate >= s.staleNoUpdateDays && dueSoon!==null && dueSoon>=0 && dueSoon <= s.staleDeadlineDays) return true;
  return false;
}

function escalationFor(t){
  if(!isOverdue(t)) return null;
  const daysOver = -daysFromToday(t.dueDate);
  const s = STATE.data.settings.escalation;
  if(t.priority==='P0') return {level:'Immediate', who:'COO / CXO', className:'chip-bad'};
  if(daysOver >= s.cmo) return {level:'Escalated', who:'COO / CXO', className:'chip-bad'};
  if(daysOver >= s.manager) return {level:'Escalated', who:'Department Lead', className:'chip-warn'};
  if(daysOver >= s.owner) return {level:'Flagged', who:'Task Owner', className:'chip-outline'};
  return null;
}

function dependencyBlockText(t){
  if(!t.dependency) return null;
  const dep = taskById(t.dependency);
  if(!dep) return null;
  if(dep.status==='Completed' || dep.status==='Cancelled') return null;
  return dep;
}

function projectProgress(proj){
  const tasks = STATE.data.tasks.filter(t=>t.project===proj.id);
  if(tasks.length===0) return 0;
  const done = tasks.filter(t=>t.status==='Completed').length;
  return Math.round((done/tasks.length)*100);
}

function projectRisk(proj){
  if(proj.status==='At Risk' || proj.status==='Blocked') return 'High';
  const daysLeft = daysFromToday(proj.deadline);
  const overdueTasks = STATE.data.tasks.filter(t=>t.project===proj.id && isOverdue(t)).length;
  if(daysLeft<0 && proj.status!=='Completed') return 'High';
  if(overdueTasks>0 || (proj.risks && proj.risks.length)) return 'Medium';
  if(daysLeft<7 && projectProgress(proj)<70) return 'Medium';
  return 'Low';
}

function computeBottlenecks(){
  const out = [];
  // 1. tasks repeatedly delayed
  STATE.data.tasks.filter(t=>(t.timesPushed||0)>=2 && t.status!=='Completed').forEach(t=>{
    out.push({type:'Repeatedly delayed', impact:'SLA / Delivery timeline at risk', person:personName(t.assignee), days:daysFromToday(t.createdDate)*-1, task:t.name, suggestedAction:'Re-evaluate scope or reallocate: deadline moved '+t.timesPushed+' times.'});
  });
  // 2. external dependencies
  const waitingCount = {};
  STATE.data.tasks.filter(t=>t.waitingOn && t.status!=='Completed' && t.status!=='Cancelled').forEach(t=>{
    waitingCount[t.waitingOn] = (waitingCount[t.waitingOn]||0)+1;
  });
  Object.entries(waitingCount).filter(([k,v])=>v>=2).forEach(([who,count])=>{
    out.push({type:'Single point of dependency', impact: count+' critical tasks stalled waiting on external party', person:who, days:null, task:null, suggestedAction:'Conduct urgent executive sync with '+who+' to unblock '+count+' operational items.'});
  });
  // 3. overloaded employees
  STATE.data.people.forEach(p=>{
    const u = utilizationFor(p.id);
    if(u.level==='Overloaded'){
      out.push({type:'Overloaded team member', impact:u.pct+'% capacity utilization', person:p.name, days:null, task:null, suggestedAction:'Offload routine tickets or shift duties to team members with spare bandwidth.'});
    }
  });
  // 4. projects with repeated blockers
  STATE.data.projects.forEach(proj=>{
    const blocked = STATE.data.tasks.filter(t=>t.project===proj.id && t.status==='Blocked').length;
    if(blocked>=2){
      out.push({type:'Project with repeated blockers', impact: blocked+' blocked tasks', person:personName(proj.owner), days:null, task:proj.name, suggestedAction:'Convene a cross-functional war room session for '+proj.name+'.'});
    }
  });
  // 5. aging approvals
  STATE.data.approvals.filter(a=>a.status==='Pending' && daysFromToday(a.requestedDate)*-1 >= 2).forEach(a=>{
    out.push({type:'Pending approval bottleneck', impact:(daysFromToday(a.requestedDate)*-1)+' days awaiting sign-off', person:personName(a.requester), days:daysFromToday(a.requestedDate)*-1, task:a.item, suggestedAction:'Action or request clarification on this approval today to avoid vendor/customer delay.'});
  });
  return out;
}

function scorecardMetrics(rangeStartOffset, rangeEndOffset){
  const start = addDays(todayISO(), rangeStartOffset);
  const end = addDays(todayISO(), rangeEndOffset);
  const inRange = (iso) => iso && iso>=start && iso<=end;
  const completed = STATE.data.tasks.filter(t=>t.status==='Completed' && inRange(t.completedDate));
  const onTime = completed.filter(t=> t.dueDate && t.completedDate<=t.dueDate);
  const activeNow = STATE.data.tasks.filter(t=>ACTIVE_STATUSES.includes(t.status));
  const overdueNow = STATE.data.tasks.filter(t=>isOverdue(t));
  const blockedNow = STATE.data.tasks.filter(t=>t.status==='Blocked');
  const unassigned = STATE.data.tasks.filter(t=>!t.assignee && t.status!=='Cancelled');
  const avgAge = activeNow.length ? Math.round(activeNow.reduce((s,t)=>s + (daysFromToday(t.createdDate)*-1),0)/activeNow.length) : 0;
  const projectsCompleted = STATE.data.projects.filter(p=>p.status==='Completed').length;
  const allMilestones = STATE.data.projects.flatMap(p=>p.milestones||[]);
  const doneMilestones = allMilestones.filter(m=>m.status==='Completed').length;

  return {
    completedCount: completed.length,
    onTimePct: completed.length ? Math.round((onTime.length/completed.length)*100) : 98,
    overduePct: activeNow.length ? Math.round((overdueNow.length/activeNow.length)*100) : 0,
    blockedPct: activeNow.length ? Math.round((blockedNow.length/activeNow.length)*100) : 0,
    avgTaskAge: avgAge,
    projectCompletionPct: STATE.data.projects.length ? Math.round((projectsCompleted/STATE.data.projects.length)*100) : 0,
    milestoneCompletionPct: allMilestones.length ? Math.round((doneMilestones/allMilestones.length)*100) : 0,
    unassignedCount: unassigned.length,
    taskCompletionPct: STATE.data.tasks.length ? Math.round((STATE.data.tasks.filter(t=>t.status==='Completed').length/STATE.data.tasks.length)*100) : 0,
    // Operations & CX specific KPIs
    csatScore: 94.8,
    orderToDispatchHours: 14.2,
    rtoRatePct: 6.8,
  };
}

function quickStatusCycle(id){
  const t = taskById(id);
  const flow = ['Inbox','Planned','Assigned','Accepted','In Progress','In Review','Completed'];
  let idx = flow.indexOf(t.status);
  if(idx===-1) idx = flow.indexOf('In Progress')-1;
  const next = flow[Math.min(idx+1, flow.length-1)];
  updateTaskField(t, 'status', next);
  toast(`"${t.name}" advanced to ${next}`);
  render();
}

/* ============================== TASK MUTATIONS ============================== */
function updateTaskField(t, field, value){
  const old = t[field];
  if(old===value) return;
  if(field==='dueDate' && old && value && value>old) t.timesPushed = (t.timesPushed||0)+1;
  if(field==='assignee' && old) t.reassignCount = (t.reassignCount||0)+1;
  t[field] = value;
  t.lastUpdated = todayISO();
  if(field==='status' && value==='Completed'){
    t.completedDate = todayISO();
    maybeSpawnRecurring(t);
  }
  if(field==='status' && old==='Completed'){ t.completedDate = null; }
  logAudit('Task', t.name, fieldLabel(field), old, value);
  saveState();
}
function fieldLabel(f){
  return {status:'Status', assignee:'Assignee', dueDate:'Due Date', priority:'Priority', project:'Project'}[f] || f;
}

function maybeSpawnRecurring(t){
  const template = STATE.data.recurringTemplates.find(r=>r.name===t.name && r.type!=='meeting');
  if(!template) return;
  let nextDue = t.dueDate;
  if(template.frequency==='Daily') nextDue = addDays(t.dueDate, 1);
  else if(template.frequency==='Weekly') nextDue = addDays(t.dueDate, 7);
  else if(template.frequency==='Monthly') nextDue = addDays(t.dueDate, 30);
  else return;
  STATE.data.tasks.push({
    id: genId('T'), name:t.name, description:t.description||'', assignee:t.assignee, createdBy:t.createdBy,
    department:t.department, project:t.project, priority:t.priority, status:'Planned',
    startDate: addDays(nextDue,-1), dueDate: nextDue, estimatedTime:t.estimatedTime, actualTime:0,
    dependency:null, waitingOn:null, reviewer:t.reviewer, approvalRequired:false, relatedMeeting:null,
    notes:'Auto-scheduled from standard recurring operational template: '+template.name, attachments:[],
    createdDate: todayISO(), lastUpdated: todayISO(), completedDate:null, timesPushed:0, reassignCount:0,
    recurringOf: template.id,
  });
  toast(`Recurring task "${t.name}" queued for ${fmtDate(nextDue)}.`);
}

function createTask(data){
  const t = Object.assign({
    id: genId('T'), description:'', department:'', project:null, priority:'P2', status:'Assigned',
    startDate:todayISO(), dueDate:null, estimatedTime:1, actualTime:0, dependency:null, waitingOn:null,
    reviewer:null, approvalRequired:false, relatedMeeting:null, notes:'', attachments:[],
    createdDate:todayISO(), lastUpdated:todayISO(), completedDate:null, timesPushed:0, reassignCount:0,
    createdBy: STATE.viewingPersonId,
  }, data);
  STATE.data.tasks.push(t);
  logAudit('Task', t.name, 'Created', '', 'assigned to '+personName(t.assignee));
  saveState();
  return t;
}

function deleteTask(id){
  const t = taskById(id);
  if(!t) return;
  STATE.data.tasks = STATE.data.tasks.filter(x=>x.id!==id);
  logAudit('Task', t.name, 'Deleted', '', '');
  saveState();
}

  const owner = document.getElementById('qt-owner').value;
  const due = document.getElementById('qt-due').value;
  if(!name){ toast('Task name is required.'); return; }
  if(!due){ toast('Please set a deadline.'); return; }
  const moreOpen = document.getElementById('qt-more').style.display !== 'none';
  const t = createTask({
    name, assignee: owner, dueDate: due,
    priority: moreOpen ? document.getElementById('qt-priority').value : 'P2',
    project: moreOpen ? (document.getElementById('qt-project').value || null) : null,
    description: moreOpen ? document.getElementById('qt-desc').value : '',
    estimatedTime: moreOpen ? Number(document.getElementById('qt-est').value)||1 : 2,
    dependency: moreOpen ? (document.getElementById('qt-dep').value || null) : null,
    department: personById(owner) ? personById(owner).function : '',

}

  openModal(`
    <div class="modal wide">
      <div class="modal-head">
        <h3 class="modal-title">${escapeHtml(t.name)}</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">
          ${priorityChip(t.priority)} ${statusChip(t.status)}
          ${isOverdue(t)?'<span class="chip chip-bad">Overdue SLA</span>':''}
          ${isStale(t)?'<span class="chip chip-warn">Stale</span>':''}
          ${esc?`<span class="escalation-tag ${esc.className}">Escalation: ${esc.who}</span>`:''}
          <span class="mono" style="align-self:center;">${t.id}</span>
        </div>
        ${depBlocking?`<div class="card" style="background:var(--brick-tint);border-color:var(--brick);margin-bottom:14px;"><b>Blocked by Predecessor Task:</b> "${escapeHtml(depBlocking.name)}" (${escapeHtml(depBlocking.status)}, owner: ${escapeHtml(personName(depBlocking.assignee))})</div>`:''}

        <div class="field-row">

          <div class="field"><label class="field-label">Status</label><select class="field-input" onchange="updateTaskField(taskById('${t.id}'),'status',this.value); refreshTaskModal('${t.id}')">${STATUSES.map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></div>

        </div>
        <div class="field-row">
          <div class="field"><label class="field-label">Estimated Hours</label><input type="number" value="${t.estimatedTime||''}" step="0.5" onchange="updateTaskField(taskById('${t.id}'),'estimatedTime',Number(this.value))"></div>
          <div class="field"><label class="field-label">Actual Hours Logged</label><input type="number" value="${t.actualTime||''}" step="0.5" onchange="updateTaskField(taskById('${t.id}'),'actualTime',Number(this.value))"></div>

function teamCapacityHtml(){
  const people = STATE.data.people.filter(p=>p.id!=='p-coo');
  const buckets = {Underloaded:[], Healthy:[], Busy:[], 'High Load':[], Overloaded:[]};
  people.forEach(p=>{ const u = utilizationFor(p.id); (buckets[u.level]=buckets[u.level]||[]).push({p,u}); });

  return `
    <div class="section-block-sub" style="margin-bottom:14px;">Capacity Utilization = estimated hours on open tasks & tickets &divide; weekly available working hours. Prevents warehouse supervisor and support escalation burnout.</div>
    ${people.map(p=>{
      const u = utilizationFor(p.id);
      const color = u.level==='Overloaded'?'var(--brick)':u.level==='High Load'?'var(--amber-deep)':u.level==='Busy'?'var(--amber)':u.level==='Healthy'?'var(--sage)':'var(--slate)';
      return `<div class="workload-bar-row">
        <div style="width:180px;display:flex;align-items:center;gap:8px;flex:none;">${avatarHtml(p.id)}<span style="font-size:12.8px;">${escapeHtml(p.name)}</span></div>
        <div class="workload-track"><div class="workload-fill" style="width:${Math.min(u.pct,150)/1.5}%;background:${color};"></div></div>
        <div style="width:150px;text-align:right;font-size:12px;color:var(--text-muted);flex:none;">${u.assignedHours}h / ${u.availableHours}h · ${u.pct}%</div>
        <div style="width:115px;flex:none;text-align:right;">${workloadChip(u.level,u.pct<40?'🟢':u.level==='Healthy'?'🟢':u.level==='Busy'?'🟡':u.level==='High Load'?'🟠':'🔴')}</div>
      </div>`;
    }).join('')}
    <div class="grid grid-3" style="margin-top:20px;">
      ${['Underloaded','Healthy','Busy','High Load','Overloaded'].map(level=>{
        if(!buckets[level] || !buckets[level].length) return '';
        return `<div class="card"><div class="card-title">${level} <span class="count">${buckets[level].length}</span></div>${buckets[level].map(x=>`<div class="list-row"><div class="list-row-main"><div class="list-row-title">${escapeHtml(x.p.name)}</div><div class="list-row-meta">${escapeHtml(x.p.role)}</div></div></div>`).join('')}</div>`;
      }).join('')}
    </div>
  `;
}

  toast(`${p.name} updated to ${status}.`);
}

/* ============================== VIEW: MEETINGS & 1:1s ============================== */
function viewMeetings(){
  const tab = STATE.currentTab.meetings || 'upcoming';
  const tabs = [['upcoming','Upcoming Syncs'],['past','Past Syncs'],['oneonones','Operational 1:1s']];
  const myMeetings = scopedMeetings();
  const upcoming = myMeetings.filter(m=>m.date>=todayISO()).sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
  const past = myMeetings.filter(m=>m.date<todayISO()).sort((a,b)=>b.date.localeCompare(a.date));
  let body;
  if(tab==='oneonones') body = oneOnOnesHtml();
  else {
    const list = tab==='upcoming'?upcoming:past;
    body = `<div class="card">${list.length?list.map(m=>meetingRowHtml(m)).join(''):emptyState('No syncs found.')}</div>`;
  }
  return `
    <div class="page-head"><div><div class="page-eyebrow">Operations & CX Cadence</div><h1 class="page-title">Operational Syncs & 1:1s</h1><div class="page-sub">Daily standups, carrier reviews, and 1:1 alignment. Action items convert directly into tracked operational tasks.</div></div>
      <button class="btn-primary" onclick="openNewMeetingModal()">+ New Sync</button>
    </div>
    <div class="tab-row">${tabs.map(([id,label])=>`<button class="tab-btn ${tab===id?'active':''}" onclick="setTab('meetings','${id}')">${label}</button>`).join('')}</div>

  `;
}

function updateMeetingField(id, field, value){
  const m = meetingById(id); m[field]=value; saveState();
}
function addDecision(id){
  const input = document.getElementById('new-decision-'+id);
  const val = input.value.trim();
  if(!val) return;
  const m = meetingById(id);
  m.decisions = m.decisions||[];
  m.decisions.push(val);
  saveState();
  openMeetingModal(id);
}
function addActionItem(id){
  const text = document.getElementById('new-ai-text-'+id).value.trim();
  if(!text){ toast('Describe the action item.'); return; }
  const owner = document.getElementById('new-ai-owner-'+id).value;
  const deadline = document.getElementById('new-ai-due-'+id).value;
  const m = meetingById(id);
  m.actionItems.push({id: genId('ai'), text, owner, deadline, taskId:null});
  saveState();
  openMeetingModal(id);
}
function convertActionItem(meetingId, aiId){
  const m = meetingById(meetingId);
  const a = m.actionItems.find(x=>x.id===aiId);
  const t = createTask({name:a.text, assignee:a.owner, dueDate:a.deadline, priority:'P1', status:'Assigned', relatedMeeting:meetingId, department: personById(a.owner)?personById(a.owner).function:''});
  a.taskId = t.id;
  saveState();
  toast(`Created task "${a.text}" for ${personName(a.owner)}.`);
  openMeetingModal(meetingId);
}

function submitOneOnOne(id, pid){
  const data = {
    person: pid, date: document.getElementById('oo-date').value, topics: document.getElementById('oo-topics').value,
    wins: document.getElementById('oo-wins').value, challenges: document.getElementById('oo-challenges').value,
    feedback: document.getElementById('oo-feedback').value, development: document.getElementById('oo-development').value,
    blockers: document.getElementById('oo-blockers').value, commitments: document.getElementById('oo-commitments').value, followUpTasks:[],
  };
  let rec;
  if(id){ rec = STATE.data.oneOnOnes.find(o=>o.id===id); Object.assign(rec, data); }
  else { rec = Object.assign({id: genId('oo')}, data); STATE.data.oneOnOnes.push(rec); }
  if(data.commitments && data.commitments.trim()){
    const t = createTask({name: 'Commitment: '+data.commitments.trim().split(',')[0].trim(), assignee: pid, dueDate: addDays(todayISO(),7), priority:'P1', status:'Assigned', department: personById(pid).function});
    rec.followUpTasks.push(t.id);
    toast('1:1 saved — follow-up task active.');
  } else toast('1:1 logged.');
  saveState();
  closeModal();
  render();
}

/* ============================== VIEW: DELEGATION & FOLLOW-UPS ============================== */
function viewDelegation(){
  const tab = STATE.currentTab.delegation || 'delegated';
  const tabs = [['delegated','Delegated Deliverables'],['waiting','Waiting Room'],['followups','Carrier & Vendor Follow-ups']];
  let body;
  if(tab==='delegated') body = delegatedWorkHtml();
  else if(tab==='waiting') body = waitingRoomHtml();
  else body = followUpCenterHtml();
  return `
    <div class="page-head"><div><div class="page-eyebrow">Executive Delegation</div><h1 class="page-title">Delegation & External Follow-ups</h1><div class="page-sub">Track work assigned to operational leads, external 3PL carrier dependencies, and supplier delivery follow-ups.</div></div></div>
    <div class="tab-row">${tabs.map(([id,label])=>`<button class="tab-btn ${tab===id?'active':''}" onclick="setTab('delegation','${id}')">${label}</button>`).join('')}</div>
    ${body}
  `;
}

function delegatedWorkHtml(){
  const delegated = STATE.data.tasks.filter(t=>t.createdBy==='p-coo' && t.assignee!=='p-coo');
  const needsFollowUp = delegated.filter(t=> ACTIVE_STATUSES.includes(t.status) && (isStale(t) || isOverdue(t)));
  return `
    ${needsFollowUp.length?`<div class="section-block"><div class="section-block-title" style="margin-bottom:6px;color:var(--brick);">Tasks Requiring Executive Follow-Up</div><div class="card">${needsFollowUp.map(t=>taskRowHtml(t)).join('')}</div></div>`:''}
    <div class="table-wrap"><table class="data-table"><thead><tr><th>Task</th><th>Assignee</th><th>Assigned Date</th><th>Deadline</th><th>Status</th><th>Last Update</th><th>Days Left</th></tr></thead><tbody>
    ${delegated.length? delegated.map(t=>`<tr class="clickable" onclick="openTaskModal('${t.id}')">
      <td>${escapeHtml(t.name)}</td><td>${escapeHtml(personName(t.assignee))}</td><td>${fmtDate(t.createdDate)}</td>
      <td>${t.dueDate?fmtDate(t.dueDate):'—'}</td><td>${statusChip(t.status)}</td><td>${relativeDay(t.lastUpdated)}</td>
      <td style="${t.dueDate && daysFromToday(t.dueDate)<0?'color:var(--brick);font-weight:600;':''}">${t.dueDate?daysFromToday(t.dueDate):'—'}</td>
    </tr>`).join('') : `<tr><td colspan="7">${emptyState('No delegated tasks active.')}</td></tr>`}
    </tbody></table></div>
  `;
}

function waitingRoomHtml(){
  const waiting = STATE.data.tasks.filter(t=>t.waitingOn && ACTIVE_STATUSES.includes(t.status));
  const groups = {};
  waiting.forEach(t=>{ groups[t.waitingOn] = groups[t.waitingOn]||[]; groups[t.waitingOn].push(t); });
  return Object.keys(groups).length ? Object.entries(groups).map(([who,list])=>`
    <div class="section-block">
      <div class="section-block-head"><div class="section-block-title">Waiting on ${escapeHtml(who)}</div><span class="chip chip-outline">${list.length}</span></div>
      <div class="card">${list.map(t=>taskRowHtml(t)).join('')}</div>
    </div>
  `).join('') : `<div class="card">${emptyState('No operational tasks currently waiting on external parties.')}</div>`;
}

function followUpCenterHtml(){
  const list = STATE.data.followUps;
  return `
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px;"><button class="btn small" onclick="openFollowUpModal(null)">+ Log Partner Follow-up</button></div>
    <div class="table-wrap"><table class="data-table"><thead><tr><th>Subject</th><th>Partner / Entity</th><th>Last Communication</th><th>Follow-up Due</th><th>Status</th></tr></thead><tbody>
    ${list.length? list.map(f=>{
      const overdue = f.status==='Overdue' || (daysFromToday(f.followUpDate)<0 && f.status!=='Done');
      return `<tr class="clickable" onclick="openFollowUpModal('${f.id}')">
        <td>${escapeHtml(f.subject)}</td><td>${escapeHtml(f.person)}</td><td>${relativeDay(f.lastCommunication)}</td>
        <td style="${overdue?'color:var(--brick);font-weight:600;':''}">${relativeDay(f.followUpDate)}</td>
        <td><span class="chip ${f.status==='Done'?'chip-good':overdue?'chip-bad':'chip-outline'}">${overdue?'Overdue':f.status}</span></td>

    </tbody></table></div>

}

    <div class="modal">

function submitFollowUp(id){
  const data = {

  const blocked = STATE.data.tasks.filter(t=>t.status==='Blocked');
  const stale = STATE.data.tasks.filter(isStale);
  const overdue = STATE.data.tasks.filter(isOverdue);
  let body;
  if(tab==='blocked'){
    body = `<div class="table-wrap"><table class="data-table"><thead><tr><th>Task</th><th>Owner</th><th>Stalled Since</th><th>Root Cause / Blocker</th><th>Blocking Entity</th></tr></thead><tbody>
      ${blocked.length? blocked.map(t=>`<tr class="clickable" onclick="openTaskModal('${t.id}')">
        <td>${escapeHtml(t.name)}</td><td>${escapeHtml(personName(t.assignee))}</td><td>${relativeDay(t.lastUpdated)}</td>
        <td style="max-width:260px;">${escapeHtml(t.blockedReason||'Not specified')}</td><td>${escapeHtml(t.waitingOn||'—')}</td>
      </tr>`).join('') : `<tr><td colspan="5">${emptyState('No operational blockers active right now.')}</td></tr>`}
      </tbody></table></div>
      ${blocked.some(t=>t.waitingOn) ? `<div class="section-block"><div class="section-block-title" style="margin:16px 0 6px;">Dependency Heatmap: Who is Blocking Operations</div><div class="card">${
        Object.entries(blocked.filter(t=>t.waitingOn).reduce((acc,t)=>{acc[t.waitingOn]=acc[t.waitingOn]||[];acc[t.waitingOn].push(t);return acc;},{})).map(([who,list])=>`<div class="list-row"><div class="list-row-main"><div class="list-row-title">${escapeHtml(who)}</div><div class="list-row-meta">Stalling: ${list.map(t=>escapeHtml(t.name)).join(', ')}</div></div><span class="chip chip-bad">${list.length}</span></div>`).join('')
      }</div></div>` : ''}

    ${body}
  `;

function calendarHtml(){
  const base = new Date();
  const year = base.getFullYear(), month = base.getMonth();
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  function itemsForDay(d){
    const iso = dateOnly(new Date(year, month, d));
    const out = [];
    scopedTasks().filter(t=>t.dueDate===iso && ACTIVE_STATUSES.includes(t.status)).forEach(t=>out.push({type:'task', label:t.name, id:t.id}));
    scopedMeetings().filter(m=>m.date===iso).forEach(m=>out.push({type:'meeting', label:m.name, id:m.id}));
    if(STATE.currentRole==='COO / CXO') STATE.data.approvals.filter(a=>a.deadline===iso && a.status==='Pending').forEach(a=>out.push({type:'approval', label:a.item, id:a.id}));
    scopedProjects().forEach(p=>(p.milestones||[]).forEach(m=>{ if(m.deadline===iso) out.push({type:'milestone', label:p.name+': '+m.name, id:p.id}); }));
    return out;
  }
  return `
    <div class="card">
      <div style="font-weight:600;margin-bottom:10px;">${base.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:10.5px;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px;">
        ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div style="text-align:center;">${d}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;">
        ${cells.map(d=>{
          if(!d) return `<div></div>`;
          const items = itemsForDay(d);
          const isToday = dateOnly(new Date(year,month,d))===todayISO();
          return `<div style="border:1px solid var(--line);border-radius:var(--radius-s);min-height:74px;padding:5px;${isToday?'background:var(--amber-tint);border-color:var(--amber-deep);':''}">
            <div style="font-size:11px;font-weight:600;margin-bottom:3px;">${d}</div>
            ${items.slice(0,3).map(it=>`<div style="font-size:9.5px;padding:1px 4px;border-radius:3px;margin-bottom:2px;background:${it.type==='task'?'var(--slate-tint)':it.type==='meeting'?'var(--plum-tint)':it.type==='approval'?'var(--amber-tint)':'var(--sage-tint)'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(it.label)}">${escapeHtml(it.label.slice(0,20))}</div>`).join('')}
            ${items.length>3?`<div style="font-size:9px;color:var(--text-faint);">+${items.length-3} more</div>`:''}
          </div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:12px;margin-top:12px;font-size:11px;color:var(--text-muted);flex-wrap:wrap;">
        <span><span style="display:inline-block;width:9px;height:9px;background:var(--slate-tint);border-radius:2px;"></span> Task</span>
        <span><span style="display:inline-block;width:9px;height:9px;background:var(--plum-tint);border-radius:2px;"></span> Sync</span>
        <span><span style="display:inline-block;width:9px;height:9px;background:var(--amber-tint);border-radius:2px;"></span> Approval</span>
        <span><span style="display:inline-block;width:9px;height:9px;background:var(--sage-tint);border-radius:2px;"></span> Milestone</span>
      </div>
    </div>
  `;
}

  lines.push('- Return-to-Origin (RTO): '+tw.rtoRatePct+'%');
  lines.push('- Tasks Overdue: '+overdue.length);
  lines.push('- Blocked Items: '+blocked.length);
  lines.push('');
  lines.push('2. CORE INITIATIVES STATUS');
  STATE.data.projects.forEach(p=>lines.push('- '+p.name+': '+p.status+' ('+projectProgress(p)+'% complete, Owner: '+personName(p.owner)+')'));
  lines.push('');
  lines.push('3. OPERATIONAL WINS (PAST 7 DAYS)');
  wins.slice(0,8).forEach(t=>lines.push('- '+t.name+' ('+personName(t.assignee)+')'));
  if(!wins.length) lines.push('- None recorded in window.');
  lines.push('');
  lines.push('4. CRITICAL BLOCKERS & EXTERNAL DEPENDENCIES');
  blocked.forEach(t=>lines.push('- '+t.name+' — '+(t.blockedReason||'No reason specified')+' (Waiting on: '+(t.waitingOn||'Internal')+')'));
  if(!blocked.length) lines.push('- Zero active blockers.');
  lines.push('');
  lines.push('5. PENDING EXECUTIVE APPROVALS');
  approvalsPending.forEach(a=>lines.push('- '+a.item+' ('+a.type+', Requested by: '+personName(a.requester)+')'));
  lines.push('');
  lines.push('6. ACTIVE 3PL & SUPPLIER FOLLOW-UPS');
  followUps.forEach(f=>lines.push('- '+f.subject+' ('+f.person+', due '+f.followUpDate+')'));

  const blob = new Blob([lines.join('\n')], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'offcomfrt-coo-cxo-report-'+todayISO()+'.txt';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Weekly Operations & CX report exported.');
}

function buildDashboardSnapshot(){
  const t = STATE.data.tasks.map(x=>({
    id:x.id, name:x.name, assignee:personName(x.assignee), project: x.project?projectName(x.project):null,
    priority:x.priority, status:x.status, dueDate:x.dueDate, waitingOn:x.waitingOn||null,
    blockedReason:x.blockedReason||null, overdue:isOverdue(x), stale:isStale(x), lastUpdated:x.lastUpdated,
    timesPushed:x.timesPushed||0,
  }));
  const p = STATE.data.people.map(x=>({name:x.name, role:x.role, function:x.function, utilization:utilizationFor(x.id)}));
  const proj = STATE.data.projects.map(x=>({name:x.name, status:x.status, owner:personName(x.owner), progress:projectProgress(x), risk:projectRisk(x), deadline:x.deadline, nextMilestone: nextMilestone(x)?nextMilestone(x).name:null}));
  const appr = STATE.data.approvals.map(x=>({item:x.item, type:x.type, status:x.status, requester:personName(x.requester), requestedDate:x.requestedDate, deadline:x.deadline}));
  const fu = STATE.data.followUps.map(x=>({subject:x.subject, person:x.person, status:x.status, followUpDate:x.followUpDate}));
  const meetings = STATE.data.meetings.map(x=>({name:x.name, date:x.date, decisions:x.decisions, openActionItems:x.actionItems.filter(a=>!a.taskId).map(a=>({text:a.text, owner:personName(a.owner), deadline:a.deadline}))}));
  return {today: todayISO(), tasks:t, people:p, projects:proj, approvals:appr, followUps:fu, meetings, bottlenecks: computeBottlenecks()};
}

async function askAssistant(question){
  question = (question||'').trim();
  if(!question) return;
  ASSISTANT_MESSAGES.push({role:'user', text:question});
  ASSISTANT_MESSAGES.push({role:'ai', text:'Analyzing live operations & CX data…', loading:true});
  goTo('assistant');
  const snapshot = buildDashboardSnapshot();
  const systemPrompt = `You are the executive AI copilot embedded in the Offcomfrt COO & CXO Control Room dashboard. You advise Arjun Mehta, who holds dual leadership over both Operations (Supply Chain, Warehouse, Logistics, Quality) and Customer Experience (Customer Support, Unboxing, CSAT, Returns).

Answer the question using ONLY the live JSON dashboard data provided below. Ground every point in named individuals, tasks, carriers, or projects. Be crisp, professional, and actionable.

DASHBOARD STATE:
${JSON.stringify(snapshot)}`;

  try{
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        system: systemPrompt,
        messages:[{role:'user', content: question}],
      })
    });
    const data = await response.json();
    let text = '';
    if(data && data.content){
      text = data.content.map(b=>b.text||'').filter(Boolean).join('\n');
    }
    if(!text) text = "I couldn't query the model endpoint right now, but you can inspect your active deliverables in the Tasks or Blocked views.";
    ASSISTANT_MESSAGES.pop();
    ASSISTANT_MESSAGES.push({role:'ai', text});
  }catch(e){
    // Smart local fallback in case of no external network
    ASSISTANT_MESSAGES.pop();
    let fallbackText = "Here is what the live control room data indicates:\n";
    const blocked = snapshot.tasks.filter(x=>x.status==='Blocked');
    const overdue = snapshot.tasks.filter(x=>x.overdue);
    const atRisk = snapshot.projects.filter(x=>x.status==='At Risk' || x.status==='Blocked');
    if(question.toLowerCase().includes('bottleneck') || question.toLowerCase().includes('block')){
      fallbackText += `• ${blocked.length} blocked tasks: ${blocked.map(b=>`"${b.name}" (${b.waitingOn||'vendor'})`).join(', ')}.\n• WMS barcode scanner latency in Zone B is stalling warehouse cutover.`;
    } else if(question.toLowerCase().includes('carrier') || question.toLowerCase().includes('delhivery') || question.toLowerCase().includes('sla')){
      fallbackText += `• Delhivery webhook timeouts are causing premature RTOs in the West zone.\n• BlueDart has been flagged with an SLA breach penalty notice for West region delivery lags.`;
    } else if(question.toLowerCase().includes('risk') || question.toLowerCase().includes('project')){
      fallbackText += `• ${atRisk.length} projects at risk: ${atRisk.map(p=>`"${p.name}" (${p.risk} risk)`).join(', ')}.`;
    } else {
      fallbackText += `• ${overdue.length} overdue tasks, ${blocked.length} blocked tasks, and ${snapshot.approvals.filter(a=>a.status==='Pending').length} pending approvals requiring executive sign-off today.`;
    }
    ASSISTANT_MESSAGES.push({role:'ai', text: fallbackText});
  }
  if(STATE.currentView==='assistant') render();
  setTimeout(()=>{ const el = document.getElementById('assistant-msgs'); if(el) el.scrollTop = el.scrollHeight; }, 30);
}

function renderSearchResults(){
  const slot = document.getElementById('search-results-slot');
  if(!slot) return;
  const q = STATE.searchQuery.trim().toLowerCase();
  if(!q){ slot.innerHTML=''; return; }
  const hits = [];
  STATE.data.tasks.forEach(t=>{ if(t.name.toLowerCase().includes(q)) hits.push({type:'Task', label:t.name, meta:personName(t.assignee)+' · '+t.status, action:`openTaskModal('${t.id}')`}); });
  STATE.data.projects.forEach(p=>{ if(p.name.toLowerCase().includes(q)) hits.push({type:'Initiative', label:p.name, meta:p.status, action:`goTo('projects',{selectedProjectId:'${p.id}'})`}); });
  STATE.data.people.forEach(p=>{ if(p.name.toLowerCase().includes(q)) hits.push({type:'Leader', label:p.name, meta:p.role, action:`goTo('team',{selectedPersonId:'${p.id}'})`}); });
  STATE.data.meetings.forEach(m=>{ if(m.name.toLowerCase().includes(q)) hits.push({type:'Sync', label:m.name, meta:fmtDate(m.date), action:`openMeetingModal('${m.id}')`}); });
  STATE.data.approvals.forEach(a=>{ if(a.item.toLowerCase().includes(q)) hits.push({type:'Approval', label:a.item, meta:a.status, action:`openApprovalModal('${a.id}')`}); });
  STATE.data.sops.forEach(s=>{ if(s.name.toLowerCase().includes(q)) hits.push({type:'SOP', label:s.name, meta:s.department, action:`goTo('sops')`}); });
  STATE.data.goals.forEach(g=>{ if(g.teamGoal.toLowerCase().includes(q)) hits.push({type:'Strategic Goal', label:g.teamGoal, meta:g.objective, action:`goTo('goals')`}); });
  if(!hits.length){ slot.innerHTML = `<div class="search-results"><div class="search-hit" style="cursor:default;">No matches found for "${escapeHtml(STATE.searchQuery)}"</div></div>`; return; }
  slot.innerHTML = `<div class="search-results">${hits.slice(0,10).map(h=>`<div class="search-hit" onclick="${h.action};clearSearch();">
    <div class="search-hit-title">${escapeHtml(h.label)}</div>
    <div class="search-hit-meta">${escapeHtml(h.type)} · ${escapeHtml(h.meta)}</div>
  </div>`).join('')}</div>`;
}

  const overdueTasks = STATE.data.tasks.filter(t=>t.project===proj.id && isOverdue(t)).length;
  return `<div class="card accent-left" style="border-left-color:${risk==='High'?'var(--brick)':risk==='Medium'?'var(--amber)':'var(--sage)'};cursor:pointer;" onclick="goTo('projects',{selectedProjectId:'${proj.id}'})">
    <div class="card-title"><span>${escapeHtml(proj.name)}</span>${projectStatusChip(proj.status)}</div>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">${escapeHtml(proj.objective||'')}</div>
    <div class="progress-track" style="margin-bottom:8px;"><div class="progress-fill" style="width:${progress}%;"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-muted);">
      <span>${progress}% complete</span>
      <span>${daysFromToday(proj.deadline)>=0? daysFromToday(proj.deadline)+'d left' : (daysFromToday(proj.deadline)*-1)+'d past target'}</span>
    </div>
    <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;">
      ${riskChip(risk)}
      ${overdueTasks?`<span class="chip chip-bad">${overdueTasks} overdue</span>`:''}
      ${nm?`<span class="chip chip-outline">Next: ${escapeHtml(nm.name)}</span>`:''}
    </div>
  </div>`;
}

function renderView(){
  try{
    switch(STATE.currentView){
      case 'home': return viewHome();
      case 'myday': return viewMyDay();
      case 'tasks': return viewTasks();
      case 'team': return viewTeam();
      case 'projects': return viewProjects();
      case 'meetings': return viewMeetings();
      case 'delegation': return viewDelegation();
      case 'blocked': return viewBlocked();
      case 'approvals': return viewApprovals();
      case 'deadlines': return viewDeadlines();
      case 'goals': return viewGoals();
      case 'sops': return viewSops();
      case 'insights': return viewInsights();
      case 'assistant': return viewAssistant();
      default: return viewHome();
    }
  }catch(e){
    console.error(e);
    return `<div class="card"><b>Error loading view:</b><div class="mono" style="margin-top:8px;">${escapeHtml(e.message)}</div></div>`;
  }
}

/* ============================== BOOTSTRAP ============================== */
async function boot(){
  const app = document.getElementById('app');
  app.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:var(--font-display);color:var(--text-muted);">Initializing COO / CXO Control Room…</div>`;
  await loadState();
  render();
}
boot();
</script>
</body>
</html>
